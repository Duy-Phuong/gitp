[package]
name = "gitp-core"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
encoding_rs = "0.8"
git2 = { version = "0.19", default-features = false, features = ["vendored-libgit2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
