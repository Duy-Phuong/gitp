<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gitp</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <span class="brand">gitp</span>
        <input id="repo-input" class="repo-input" placeholder="/path/to/repository" spellcheck="false" />
        <button id="browse-btn" class="btn ghost">Browse…</button>
        <button id="open-btn" class="btn">Open</button>
        <span id="branch-indicator" class="branch-chip hidden" title="Current branch"></span>
        <nav class="tabs">
          <button class="tab active" data-tab="history">History</button>
          <button class="tab" data-tab="config">Config</button>
        </nav>
        <button id="terminal-toggle" class="btn ghost">Terminal</button>
        <div id="settings" class="settings">
          <button id="settings-btn" class="btn ghost icon-btn" title="Settings" aria-haspopup="true" aria-expanded="false">⚙</button>
          <div id="settings-menu" class="menu hidden" role="menu">
            <button class="menu-item" data-action="git-config" role="menuitem">Git Config</button>
            <div class="menu-sep"></div>
            <div class="menu-label">Theme</div>
            <button class="menu-item" data-theme-choice="system" role="menuitemradio">System</button>
            <button class="menu-item" data-theme-choice="light" role="menuitemradio">Light</button>
            <button class="menu-item" data-theme-choice="dark" role="menuitemradio">Dark</button>
          </div>
        </div>
      </header>

      <div id="action-bar" class="action-bar hidden">
        <button id="pull-btn" class="action-btn" title="Pull (fetch + merge) from the remote">
          <span class="action-label">Pull</span>
          <span id="pull-badge" class="action-badge hidden"></span>
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14" />
          </svg>
        </button>
        <span class="action-sep"></span>
        <button id="push-btn" class="action-btn" title="Push the current branch to the remote">
          <span class="action-label">Push</span>
          <span id="push-badge" class="action-badge hidden"></span>
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 21V9m0 0l-5 5m5-5l5 5M5 3h14" />
          </svg>
        </button>
        <span class="action-sep"></span>
        <div id="branch-wrap" class="action-item">
          <button id="branch-btn" class="action-btn" title="Switch to or create a branch" aria-haspopup="true" aria-expanded="false">
            <span class="action-label">Branch</span>
            <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="6" cy="6" r="2.4" />
              <circle cx="6" cy="18" r="2.4" />
              <circle cx="18" cy="7" r="2.4" />
              <path d="M6 8.4v7.2M6 12h6a6 6 0 006-6v-.6" />
            </svg>
          </button>
          <div id="branch-menu" class="menu hidden" role="menu"></div>
        </div>
        <span class="action-sep"></span>
        <button id="stash-btn" class="action-btn" title="Stash local changes">
          <span class="action-label">Stash</span>
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v10m0 0l-3.5-3.5M12 13l3.5-3.5" />
            <path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" />
          </svg>
        </button>
        <span class="action-sep"></span>
        <button id="pop-btn" class="action-btn" title="Pop the most recent stash">
          <span class="action-label">Pop</span>
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 13V3m0 0L8.5 6.5M12 3l3.5 3.5" />
            <path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" />
          </svg>
        </button>
        <span class="action-sep"></span>
        <button id="refresh-btn" class="action-btn" title="Fetch all remotes and reload — updates every branch's ahead/behind">
          <span class="action-label">Refresh</span>
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8 8 0 10-.6 4M20 4v5h-5" />
          </svg>
        </button>
      </div>

      <div id="repo-tabs" class="repo-tabs hidden"></div>

      <main class="content">
        <aside id="sidebar" class="sidebar"></aside>
        <div id="sidebar-divider" class="pane-divider" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
        <div id="main-panel" class="main-panel">
          <section id="history-view" class="view">
            <div id="log-col" class="log-col">
              <div id="log-toolbar" class="log-toolbar">
                <div class="seg-toggle" role="group" aria-label="Which branches to show">
                  <button id="branches-all" class="seg active" title="Show commits from every branch">All branches</button>
                  <button id="branches-current" class="seg" title="Show only the current branch's history">Current</button>
                </div>
              </div>
              <div id="log-pane" class="log-pane"></div>
            </div>
            <div id="pane-divider" class="pane-divider" role="separator" aria-orientation="vertical" title="Drag to resize"></div>
            <div id="detail-pane" class="detail-pane"></div>
          </section>
          <section id="changes-view" class="view hidden">
            <div id="changes-pane" class="changes-pane"></div>
          </section>
          <section id="config-view" class="view hidden">
            <div id="config-editor" class="config-editor"></div>
          </section>
        </div>
      </main>

      <section id="terminal-panel" class="terminal-panel hidden">
        <div class="terminal-head">
          <span>Terminal</span>
          <button id="terminal-close" class="btn ghost small">Hide</button>
        </div>
        <div id="terminal-host" class="terminal-host"></div>
      </section>

      <footer id="statusbar" class="statusbar"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
