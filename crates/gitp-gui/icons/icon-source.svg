<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
  </defs>

  <!-- outer indigo ring: wraps the icon with a small transparent gap -->
  <rect x="14" y="14" width="484" height="484" rx="108"
        fill="none" stroke="#6366f1" stroke-width="20"/>

  <!-- rounded-square backdrop, inset inside the ring -->
  <rect x="48" y="48" width="416" height="416" rx="90" fill="url(#bg)"/>

  <!-- git commit graph: main lane + a branch that forks and merges back -->
  <g fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round">
    <!-- main lane -->
    <path d="M198 158 L198 354"/>
    <!-- branch out -->
    <path d="M198 158 C 198 210 314 206 314 256"/>
    <!-- merge back -->
    <path d="M314 256 C 314 306 198 302 198 354"/>
  </g>

  <!-- commit nodes -->
  <g fill="#ffffff">
    <circle cx="198" cy="158" r="30"/>
    <circle cx="314" cy="256" r="30"/>
    <circle cx="198" cy="354" r="30"/>
  </g>
  <g fill="url(#bg)">
    <circle cx="198" cy="158" r="12"/>
    <circle cx="314" cy="256" r="12"/>
    <circle cx="198" cy="354" r="12"/>
  </g>
</svg>
