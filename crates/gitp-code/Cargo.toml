[package]
name = "gitp-code"
version = "0.1.0"
edition = "2021"

[dependencies]
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
regex-syntax = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
streaming-iterator = "0.1"
tree-sitter = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"

[dev-dependencies]
tempfile = "3"
