name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # gitp only supports macOS today (system WebKit), so CI builds there too.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crates/gitp-gui/webui/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix crates/gitp-gui/webui ci

      - name: Typecheck frontend
        run: npm --prefix crates/gitp-gui/webui run typecheck

      - name: Test frontend
        run: npm --prefix crates/gitp-gui/webui test

      # tauri::generate_context! needs webui/dist to exist at compile time.
      - name: Build frontend
        run: npm --prefix crates/gitp-gui/webui run build

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The core tests create throwaway repos and commit in them.
      - name: Configure git identity
        run: |
          git config --global user.name "gitp CI"
          git config --global user.email "ci@gitp.invalid"
          git config --global init.defaultBranch main

      - name: Test Rust
        run: cargo test --workspace
